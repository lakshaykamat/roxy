<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brain map · Roxy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
    <a class="text-sm font-medium text-violet-700 underline" href="/">← Dashboard</a>
    <header class="mt-5">
      <p class="text-sm font-semibold tracking-wide text-violet-700">ROXY</p>
      <h1 class="mt-1 text-3xl font-bold tracking-tight">Thought map</h1>
      <p class="mt-2 max-w-2xl text-slate-600">Active saved items connect when they share a tag. Circle colour shows item type; larger circles have more connections.</p>
    </header>
    <section class="mt-7 overflow-x-auto rounded-xl border border-slate-200 bg-white p-4 shadow-sm" aria-labelledby="map-title">
      <h2 id="map-title" class="sr-only">Brain item relationship map</h2>
      <svg class="min-w-[900px]" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="Thought map showing saved items and their shared-tag relationships">
        {{edges}}
        {{nodes}}
      </svg>
    </section>
    <section class="mt-8 rounded-xl border border-slate-200 bg-white p-5 shadow-sm" aria-labelledby="item-list-title">
      <h2 id="item-list-title" class="text-xl font-bold">Saved items</h2>
      <ul class="mt-3">{{details}}</ul>
    </section>
  </main>
</body>
</html>
