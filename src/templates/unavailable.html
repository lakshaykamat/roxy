<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef0e9">
  <title>Dashboard unavailable · Roxy</title>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { paper: '#eef0e9', panel: '#f9faf6', ink: '#18231b', line: '#8b9588', accent: '#315b3b', alert: '#823a2e' }, fontFamily: { mono: ['"Courier New"', 'Courier', 'monospace'] } } } };

</head>
<body class="min-h-screen bg-paper font-mono text-sm text-ink antialiased">

      <span class="mx-auto grid h-12 w-12 place-items-center border-2 border-alert text-xl font-bold text-alert">!</span>
      <p class="mt-5 text-xs font-bold tracking-[0.18em] text-accent">ROXY / SYSTEM NOTICE</p>

      <p class="mt-3 text-xs leading-5">Roxy can’t reach its local data store right now. Check the service, then refresh this page.</p>
      <a class="mt-7 inline-flex min-h-11 items-center border-2 border-ink bg-accent px-4 py-2 text-xs font-bold text-panel transition hover:bg-ink focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2" href="/">TRY AGAIN</a>
