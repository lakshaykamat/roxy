<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef0e9">
  <title>Sign in · Roxy</title>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { paper: '#eef0e9', panel: '#f9faf6', ink: '#18231b', line: '#8b9588', accent: '#315b3b', alert: '#823a2e' },
          fontFamily: { mono: ['"Courier New"', 'Courier', 'monospace'] }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-paper font-mono text-sm text-ink antialiased">
  <main class="flex min-h-screen items-center justify-center px-5 py-10">
    <section class="w-full max-w-md border-2 border-ink bg-panel p-6 sm:p-8" aria-labelledby="page-title">
      <div class="mb-8 flex items-center gap-3">
        <span class="grid h-10 w-10 place-items-center border-2 border-ink bg-accent text-lg font-bold text-panel">R</span>
        <div>
          <p class="text-sm font-bold tracking-[0.18em] text-ink">ROXY</p>
          <p class="text-xs">PRIVATE ASSISTANT / SIGN IN</p>
        </div>
      </div>
      <p class="text-xs font-bold tracking-[0.16em] text-accent">ACCESS / 00</p>
      <h1 id="page-title" class="mt-2 text-2xl font-bold tracking-tight text-ink">Private system access</h1>
      <p class="mt-2 text-xs leading-5">Sign in to view Roxy’s system record and connected memory.</p>
      <div class="mt-5 text-sm text-alert [&>p]:border-2 [&>p]:border-alert [&>p]:px-3 [&>p]:py-2">{{error_message}}</div>
      <form method="post" action="/login" class="mt-6 space-y-5">
        <label class="block text-xs font-bold tracking-wide">
          PASSWORD
          <input class="mt-2 block min-h-11 w-full border-2 border-ink bg-panel px-3 py-2 text-base text-ink outline-none transition focus:ring-2 focus:ring-accent" type="password" name="password" autocomplete="current-password" required autofocus>
        </label>
        <button class="min-h-11 w-full border-2 border-ink bg-accent px-4 py-2 text-xs font-bold text-panel transition hover:bg-ink focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2" type="submit">SIGN IN</button>
      </form>
    </section>
  </main>
</body>
</html>
